name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same version as the `jsr:@denext/denext@^4.18.0` pin in deno.json.
  DENEXT_VERSION: v4.18.0
  DENO_DIR: ${{ github.workspace }}/../deno-dir

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: windows-x64, os: windows-2025 }
          - { name: linux-x64, os: ubuntu-24.04 }
    steps:
      # deno fmt --check wants LF; Windows runners check out CRLF by default.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-dir-${{ matrix.os }}-${{ env.DENEXT_VERSION }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-dir-${{ matrix.os }}-${{ env.DENEXT_VERSION }}-
      - name: Install denext
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://denext.dev/install.sh | sh -s -- --no-modify-path
          echo "$HOME/.denext/bin" >> "$GITHUB_PATH"
      - name: Install denext
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://denext.dev/install.ps1 | iex
          "$HOME\.denext\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: denext --version
      - name: denext task check (fmt, lint, tests)
        run: denext task check

  package:
    name: package (${{ matrix.name }})
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Phase 2: installers. Windows and Linux packaging has not been exercised in CI yet, so a
    # failure there does not fail the workflow for now; macOS must pass.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            experimental: false
            command: denext task desktop:package
            artifact: dist/Fleet.dmg
          - name: windows-x64
            os: windows-2025
            experimental: true
            command: denext task desktop:package:windows
            artifact: dist/Fleet-x64-windows.zip
          - name: linux-x64
            os: ubuntu-24.04
            experimental: true
            command: denext run -A scripts/package-linux.ts --arch x86_64
            artifact: |
              dist/*.tar.gz
              dist/*.deb
    steps:
      # deno fmt --check wants LF; Windows runners check out CRLF by default.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-dir-${{ matrix.os }}-${{ env.DENEXT_VERSION }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-dir-${{ matrix.os }}-${{ env.DENEXT_VERSION }}-
      - name: Install denext
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://denext.dev/install.sh | sh -s -- --no-modify-path
          echo "$HOME/.denext/bin" >> "$GITHUB_PATH"
      - name: Install denext
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://denext.dev/install.ps1 | iex
          "$HOME\.denext\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Package (unsigned)
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
